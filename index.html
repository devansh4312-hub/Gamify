<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110e18; --panel:#1b1726; --panel2:#241f33; --line:#352e4a; --text:#ece6f7; --dim:#9a90b3;
  --gold:#ffcc4d; --bio:#5fd38d; --cp:#ff6b6b; --ocw:#a594ff; --curse:#c04cff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;line-height:1.45}
body{background-image:radial-gradient(circle at 20% -10%,#2a1f45 0,transparent 45%),radial-gradient(circle at 110% 30%,#1f2a3f 0,transparent 40%);min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:18px 14px 60px}
.px{font-family:"Press Start 2P",monospace;letter-spacing:.5px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
header h1{font-size:15px;margin:0;color:var(--gold);text-shadow:2px 2px 0 #6b3d00}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 #0a0810}
.label{font-size:9px;color:var(--dim);margin-bottom:10px;text-transform:uppercase}
.mod{border-color:#5c4a1c;background:linear-gradient(90deg,#2a2212,#1b1726)}
.mod b{color:var(--gold)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kind{background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:8px;padding:8px 4px;cursor:pointer;font:inherit;font-size:12px;text-align:center}
.kind .px{font-size:9px;display:block;margin-bottom:4px}
.kind.on{border-color:var(--gold);background:#2e2614}
.floor{width:100%;display:flex;align-items:center;gap:12px;background:var(--panel2);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--text);font:inherit;text-align:left;transition:transform .08s}
.floor:hover{transform:translateX(3px);border-color:var(--c)}
.floor:active{transform:scale(.98)}
.floor .ic{font-size:26px;width:34px;text-align:center}
.floor .nm{font-weight:700}
.floor .sub{font-size:12px;color:var(--dim)}
.floor .lv{margin-left:auto;text-align:right;min-width:92px}
.floor .lv .px{font-size:10px;color:var(--c)}
.bar{height:7px;background:#0d0b13;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--gold))}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.room{text-align:center;border-color:var(--c);border-width:2px}
.room .t{font-family:"Press Start 2P";font-size:44px;margin:14px 0 8px;color:var(--c)}
.room.cursed{border-color:var(--curse)}
.room.cursed .t{color:var(--curse)}
.btn{background:var(--panel2);border:2px solid var(--line);color:var(--text);border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--dim)}
.btn.gold{background:var(--gold);color:#2a1a00;border-color:#b8860b}
.btn.curse{border-color:var(--curse);color:#e4b3ff}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats .n{font-family:"Press Start 2P";font-size:15px;margin-bottom:6px}
.stats .k{font-size:11px;color:var(--dim)}
.inv{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.item .ic{font-size:22px}
.item .tx{flex:1;font-size:13px}
.item .tx b{display:block;font-size:13px}
.item .ct{font-family:"Press Start 2P";font-size:11px;color:var(--gold);margin-right:4px}
.empty{color:var(--dim);font-size:13px}
.hist{display:flex;align-items:flex-end;gap:4px;height:70px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.hist i{display:block;width:100%;background:var(--ocw);border-radius:3px 3px 0 0;min-height:2px}
.hist i.today{background:var(--gold)}
.hist span{font-size:9px;color:var(--dim);margin-top:3px}
details summary{cursor:pointer;color:var(--dim);font-size:13px}
.set{display:grid;gap:8px;margin-top:10px}
.set label{font-size:12px;color:var(--dim)}
.set input{width:100%;background:#0d0b13;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 8px;font:inherit;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(8,6,12,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:2px solid var(--gold);border-radius:12px;max-width:380px;width:100%;padding:22px;text-align:center;box-shadow:0 0 40px #ffcc4d33}
.modal h2{font-size:13px;color:var(--gold);margin:0 0 12px;line-height:1.6}
.die{font-family:"Press Start 2P";font-size:54px;margin:12px 0;color:var(--text)}
.die.rare{color:var(--gold);text-shadow:0 0 18px var(--gold)}
.loot{font-size:15px;margin:6px 0 4px;font-weight:700}
.loot small{display:block;font-weight:400;color:var(--dim);margin-top:4px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:13px;z-index:20;max-width:90vw;text-align:center}
.sync{font-size:11px;color:var(--dim);text-align:center;margin-top:8px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.rolling{animation:shake .15s infinite}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="px">THE DAILY RUN</h1>
    <div class="chips" id="chips"></div>
  </header>
  <div class="panel mod" id="mod"></div>
  <div id="main"></div>
  <div class="panel"><div class="label px">Today's run</div><div class="stats" id="stats"></div></div>
  <div class="panel"><div class="label px">Inventory</div><div class="inv" id="inv"></div></div>
  <div class="panel"><div class="label px">The Vault</div><div id="vault"></div></div>
  <div class="panel"><div class="label px">Last 14 runs</div><div class="hist" id="hist"></div></div>
  <div class="panel">
    <details id="settingsBox"><summary>Settings: rewards &amp; vault goal</summary>
      <div class="set">
        <label>📦 Small chest reward<input id="sSmall"></label>
        <label>🎁 Chest reward<input id="sChest"></label>
        <label>👑 Rare chest reward<input id="sRare"></label>
        <label>🏆 Vault goal (what you're saving coins for)<input id="sGoal"></label>
        <label>Coins needed<input id="sCost" type="number" min="1"></label>
        <div><button class="btn sm gold" id="saveSet">Save settings</button></div>
        <label style="margin-top:8px">Backup (progress lives in this browser)</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="exportBackup()">⬇ Export backup</button>
          <label class="btn sm" style="color:var(--text);font-size:12px">⬆ Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0]);this.value=''"></label></div>
      </div>
    </details>
  </div>
  <div class="sync" id="sync"></div>
</div>
<div id="overlay"></div>
<div id="toastBox"></div>

<script>
const FLOORS={
  bio:{name:"Bio Lectures",icon:"🧬",c:"var(--bio)",sub:"MSc lectures & notes"},
  cp:{name:"Coding",icon:"⚔️",c:"var(--cp)",sub:"CP, contests, projects"},
  ocw:{name:"MIT OCW",icon:"📜",c:"var(--ocw)",sub:"Maths for CS · DSA"}
};
const KINDS={
  warm:{name:"Room 0",min:5,xp:5,coins:0,sub:"5 min · just start"},
  room:{name:"Room",min:50,xp:20,coins:2,sub:"50 min"},
  boss:{name:"Boss",min:120,xp:50,coins:5,sub:"2 hrs · free chest"}
};
const MODS=[
  {id:"boss",name:"Boss Rush",desc:"Boss rooms give double XP."},
  {id:"lucky",name:"Lucky Day",desc:"+3 on every loot roll."},
  {id:"speed",name:"Speedrun",desc:"Clear 6 rooms before 6 PM for a bonus Chest."},
  {id:"glass",name:"Glass Cannon",desc:"Clean rooms give 1.5× XP. Cursed rooms give nothing."},
  {id:"early",name:"Early Bird",desc:"Rooms started before noon give double XP."},
  {id:"siege",name:"Night Siege",desc:"Rooms started after 7 PM get +4 on loot rolls. Take the evening back."},
  {id:"combo",name:"Combo Chain",desc:"Each clean room in a row adds +1 to your next roll. A curse resets it."}
];
const TIERS={
  small:{name:"Small chest",icon:"📦"},
  chest:{name:"Chest",icon:"🎁"},
  rare:{name:"Rare chest",icon:"👑"}
};
const LS="daily-run-v1";

function defaults(){return{v:1,updatedAt:0,xp:{bio:0,cp:0,ocw:0},coins:0,inv:{small:0,chest:0,rare:0},days:{},active:null,pending:null,pity:0,kind:"room",
  settings:{small:"Snack or a 5-min walk",chest:"20 min of guilt-free gaming",rare:"One full roguelike run + food order",goal:"Buy a new roguelike on sale",cost:40}}}
function norm(s){const d=defaults();if(!s||typeof s!=="object")return d;
  const o=Object.assign(d,s);o.xp=Object.assign(defaults().xp,s.xp||{});o.inv=Object.assign(defaults().inv,s.inv||{});o.settings=Object.assign(defaults().settings,s.settings||{});o.days=s.days||{};return o;}

let S=defaults();
try{const raw=localStorage.getItem(LS);if(raw)S=norm(JSON.parse(raw));}catch(e){}

// ---------- time helpers (a "day" ends at 4 AM, for night owls) ----------
function dayKey(t){const d=new Date((t||Date.now())-4*3600e3);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){const k=dayKey();if(!S.days[k])S.days[k]={rooms:0,clean:0,cursed:0,xp:0,combo:0,speed:false};return S.days[k];}
function todayPeek(){return S.days[dayKey()]||{rooms:0,clean:0,cursed:0,xp:0,combo:0,speed:false};}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return Math.abs(h);}
function mod(){return MODS[hash(dayKey()+"run")%MODS.length];}
function hourNow(){return new Date().getHours();}

function level(xp){let L=1,need=100;while(xp>=need){xp-=need;L++;need+=50;}return{L,cur:xp,need};}
function streak(){let n=0;const t=new Date();let k=dayKey();if(!(S.days[k]&&S.days[k].rooms>0)){t.setDate(t.getDate()-1);}
  for(let i=0;i<4000;i++){const kk=dayKey(t.getTime());if(S.days[kk]&&S.days[kk].rooms>0){n++;t.setDate(t.getDate()-1);}else break;}return n;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---------- persistence (browser storage) ----------
function save(){S.updatedAt=Date.now();
  const ks=Object.keys(S.days).sort();if(ks.length>400)ks.slice(0,ks.length-400).forEach(k=>delete S.days[k]);
  try{localStorage.setItem(LS,JSON.stringify(S));setSync("Saved in this browser ✓ — use Export backup to move it to another device.");}
  catch(e){setSync("Couldn't save — your browser is blocking storage (private mode?).");}}
function setSync(t){document.getElementById("sync").textContent=t;}
function exportBackup(){const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="daily-run-backup-"+dayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.xp)throw 0;
  S=norm(d);save();render();toast("Backup restored.");}catch(e){toast("That file isn't a Daily Run backup.");}};r.readAsText(file);}
window.addEventListener("storage",e=>{if(e.key===LS&&e.newValue){try{S=norm(JSON.parse(e.newValue));render();}catch(_){}}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")tick();});
setSync("Progress saves in this browser. Use Export backup (in Settings) to move it to another device.");

// ---------- audio ----------
let actx=null;
function primeAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){}}
function chime(){if(!actx)return;try{[523,659,784,1047].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;
  g.gain.setValueAtTime(.08,actx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.12+.25);
  o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.12);o.stop(actx.currentTime+i*.12+.3);});}catch(e){}}

// ---------- actions ----------
function startRoom(floor){primeAudio();const k=S.kind;S.active={floor,kind:k,start:Date.now(),dur:KINDS[k].min*60e3,cursed:false,hour:hourNow()};save();render();}
function curse(){if(!S.active||S.active.cursed)return;S.active.cursed=true;const d=today();d.combo=0;save();render();toast("☠️ Cursed. The room still counts — just no loot. Put the phone away and finish it.");}
let abandonArmed=false;
function abandon(){if(!abandonArmed){abandonArmed=true;render();setTimeout(()=>{abandonArmed=false;render();},3000);return;}
  abandonArmed=false;S.active=null;save();render();toast("Room abandoned. No XP, no shame — start another.");}
function finishRoom(){const a=S.active;if(!a)return;const K=KINDS[a.kind],m=mod(),d=today();
  let mult=1;if(m.id==="boss"&&a.kind==="boss")mult=2;if(m.id==="early"&&a.hour<12)mult=2;if(m.id==="glass")mult=a.cursed?0:1.5;
  const xp=Math.round(K.xp*mult);S.xp[a.floor]+=xp;S.coins+=K.coins;d.rooms++;d.xp+=xp;
  if(a.cursed)d.cursed++;else{d.clean++;}
  let bonus=[];
  if(a.kind==="boss"&&!a.cursed){S.inv.chest++;bonus.push("Boss defeated → free 🎁 Chest");}
  if(m.id==="speed"&&!d.speed&&d.rooms>=6&&hourNow()<18){d.speed=true;S.inv.chest++;bonus.push("Speedrun complete → bonus 🎁 Chest");}
  S.pending={floor:a.floor,kind:a.kind,cursed:a.cursed,xp,coins:K.coins,hour:a.hour,bonus,roll:null};
  S.active=null;save();chime();render();}
function roll(){const p=S.pending;if(!p||p.roll)return;const m=mod(),d=today();
  let b=0;if(m.id==="lucky")b+=3;if(m.id==="siege"&&p.hour>=19)b+=4;if(m.id==="combo")b+=d.combo;
  let nat=1+Math.floor(Math.random()*20),pity=false;
  if(S.pity>=4&&nat+b<16){nat=Math.max(nat,16-b);pity=true;}
  const tot=nat+b;let tier=null;if(tot>=20)tier="rare";else if(tot>=16)tier="chest";else if(tot>=10)tier="small";
  if(tier)S.inv[tier]++;S.pity=(tier==="chest"||tier==="rare")?0:S.pity+1;
  if(m.id==="combo")d.combo++;
  p.roll={nat,b,tot,tier,pity};
  // animate
  const el=document.getElementById("die");if(el){el.classList.add("rolling");let n=0;const iv=setInterval(()=>{el.textContent=1+Math.floor(Math.random()*20);if(++n>12){clearInterval(iv);el.classList.remove("rolling");save();render();}},70);}else{save();render();}
}
function closeLoot(){S.pending=null;save();render();}
function useItem(t){if(S.inv[t]<=0)return;S.inv[t]--;save();render();toast(TIERS[t].icon+" Enjoy: "+S.settings[t]);}
function claimVault(){const c=Number(S.settings.cost)||40;if(S.coins<c)return;S.coins-=c;save();render();toast("🏆 Unlocked: "+S.settings.goal+". You earned it.");}
function setKind(k){S.kind=k;save();render();}

function toast(t){const b=document.getElementById("toastBox");b.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>b.innerHTML="",3800);}

// ---------- render ----------
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function render(){
  const d=todayPeek(),m=mod();
  document.getElementById("chips").innerHTML=`<span class="chip">🔥 ${streak()} day streak</span><span class="chip">🪙 ${S.coins}</span>`;
  document.getElementById("mod").innerHTML=`<div class="label px">Today's modifier</div><b>${esc(m.name)}</b> — ${esc(m.desc)}${m.id==="combo"?` <span style="color:var(--gold)">(current: +${d.combo})</span>`:""}`;
  const main=document.getElementById("main");
  if(S.active){const a=S.active,F=FLOORS[a.floor],K=KINDS[a.kind];
    main.innerHTML=`<div class="panel room ${a.cursed?"cursed":""}" style="--c:${F.c}">
      <div class="label px">${F.icon} ${esc(F.name)} · ${K.name}</div>
      <div class="t" id="timer">${fmt(a.start+a.dur-Date.now())}</div>
      <div class="bar" style="--c:${a.cursed?"var(--curse)":F.c}"><i id="tbar" style="width:0%"></i></div>
      <div class="hint">${a.cursed?"Cursed — finish anyway. XP still counts.":"Phone face-down, out of reach. You've got this."}</div>
      <div class="row">${a.cursed?"":`<button class="btn curse" onclick="curse()">📱 I picked up my phone</button>`}
      <button class="btn" onclick="abandon()">${abandonArmed?"Tap again to abandon":"Abandon"}</button></div></div>`;
  }else{
    const first=d.rooms===0;
    main.innerHTML=`<div class="panel"><div class="label px">${first?"Start with Room 0 — just open the work":"Pick a room, then a floor"}</div>
      <div class="kinds">${Object.entries(KINDS).map(([k,K])=>`<button class="kind ${S.kind===k?"on":""}" onclick="setKind('${k}')"><span class="px">${K.name}</span>${K.sub}</button>`).join("")}</div>
      ${Object.entries(FLOORS).map(([f,F])=>{const l=level(S.xp[f]);return `<button class="floor" style="--c:${F.c}" onclick="startRoom('${f}')">
        <span class="ic">${F.icon}</span><span><div class="nm">${esc(F.name)}</div><div class="sub">${esc(F.sub)}</div></span>
        <span class="lv"><span class="px">LV ${l.L}</span><div class="bar"><i style="width:${(l.cur/l.need*100).toFixed(0)}%"></i></div><div class="sub">${l.cur}/${l.need} XP</div></span></button>`}).join("")}
      <div class="hint">Tap a floor to enter. The timer keeps running even if you close this page.</div></div>`;
  }
  document.getElementById("stats").innerHTML=[[d.rooms,"rooms"],[d.xp,"XP"],[d.clean,"clean"],[d.cursed,"cursed"]].map(([n,k])=>`<div><div class="n">${n}</div><div class="k">${k}</div></div>`).join("");
  const inv=Object.keys(TIERS).filter(t=>S.inv[t]>0);
  document.getElementById("inv").innerHTML=inv.length?inv.map(t=>`<div class="item"><span class="ic">${TIERS[t].icon}</span><span class="tx"><b>${TIERS[t].name}</b>${esc(S.settings[t])}</span><span class="ct">×${S.inv[t]}</span><button class="btn sm gold" onclick="useItem('${t}')">Open</button></div>`).join("")
    :`<div class="empty">No chests yet. Clear rooms and roll the d20 to find loot.${S.pity>0?` (Pity counter: ${S.pity}/4 — a guaranteed chest is coming.)`:""}</div>`;
  const c=Number(S.settings.cost)||40,pct=Math.min(100,S.coins/c*100);
  document.getElementById("vault").innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>🏆 ${esc(S.settings.goal)}</span><span class="px" style="font-size:10px;color:var(--gold)">${S.coins}/${c}</span></div>
    <div class="bar" style="--c:var(--gold)"><i style="width:${pct}%"></i></div>
    <div class="hint">Coins: Room +2 · Boss +5. Permanent — they carry across every run.</div>
    ${S.coins>=c?`<div class="row"><button class="btn gold" onclick="claimVault()">Claim reward</button></div>`:""}`;
  const days=[];const t=new Date();for(let i=13;i>=0;i--){const x=new Date(t);x.setDate(t.getDate()-i);const k=dayKey(x.getTime());days.push([k,(S.days[k]||{}).rooms||0,i===0]);}
  const mx=Math.max(4,...days.map(x=>x[1]));
  document.getElementById("hist").innerHTML=days.map(([k,n,isT])=>`<div title="${k}: ${n} rooms"><i class="${isT?"today":""}" style="height:${n/mx*100}%"></i><span>${n||""}</span></div>`).join("");
  renderModal();tick();
}
function renderModal(){const o=document.getElementById("overlay"),p=S.pending;if(!p){o.innerHTML="";return;}
  const F=FLOORS[p.floor],K=KINDS[p.kind];
  const head=`<h2 class="px">${p.cursed?"ROOM CLEARED… CURSED":"ROOM CLEARED!"}</h2><div>${F.icon} ${esc(F.name)} · ${K.name}</div><div class="hint">+${p.xp} XP${p.coins?` · +${p.coins} 🪙`:""}</div>${p.bonus.map(b=>`<div class="loot" style="color:var(--gold)">${esc(b)}</div>`).join("")}`;
  let body;
  if(p.cursed){body=`<div class="die">☠️</div><div class="loot">No loot roll this time.<small>Next room: phone in another room.</small></div><div class="row"><button class="btn gold" onclick="closeLoot()">Next room</button></div>`;}
  else if(!p.roll){body=`<div class="die" id="die">d20</div><div class="row"><button class="btn gold" onclick="roll()">🎲 Roll for loot</button></div>`;}
  else{const r=p.roll,T=r.tier?TIERS[r.tier]:null;
    const lines={rare:"A RARE CHEST. The dungeon smiles on you.",chest:"A chest! Nicely done.",small:"Small chest. Every bit counts."};
    body=`<div class="die ${r.tier==="rare"?"rare":""}">${r.tot}</div><div class="hint">rolled ${r.nat}${r.b?` + ${r.b} bonus`:""}${r.pity?" · pity kicked in":""}</div>
      <div class="loot">${T?`${T.icon} ${lines[r.tier]}<small>${esc(S.settings[r.tier])} — added to inventory</small>`:`Empty room.<small>Nothing this time. Pity counter: ${S.pity}/4</small>`}</div>
      <div class="row"><button class="btn gold" onclick="closeLoot()">Next room</button></div>`;}
  o.innerHTML=`<div class="overlay"><div class="modal">${head}${body}</div></div>`;}
function tick(){const a=S.active;if(!a){document.title="The Daily Run";return;}
  const left=a.start+a.dur-Date.now();if(left<=0){finishRoom();return;}
  const el=document.getElementById("timer");if(el)el.textContent=fmt(left);
  const b=document.getElementById("tbar");if(b)b.style.width=((1-left/a.dur)*100).toFixed(1)+"%";
  document.title=fmt(left)+" · "+FLOORS[a.floor].name;}
setInterval(tick,500);

// settings
const sb=document.getElementById("settingsBox");
sb.addEventListener("toggle",()=>{if(!sb.open)return;sSmall.value=S.settings.small;sChest.value=S.settings.chest;sRare.value=S.settings.rare;sGoal.value=S.settings.goal;sCost.value=S.settings.cost;});
document.getElementById("saveSet").onclick=()=>{S.settings.small=sSmall.value.trim()||defaults().settings.small;S.settings.chest=sChest.value.trim()||defaults().settings.chest;
  S.settings.rare=sRare.value.trim()||defaults().settings.rare;S.settings.goal=sGoal.value.trim()||defaults().settings.goal;S.settings.cost=Math.max(1,parseInt(sCost.value)||40);
  save();render();sb.open=false;toast("Settings saved.");};
render();
</script>
</body>
</html>
